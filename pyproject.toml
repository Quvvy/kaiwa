[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiwa"
version = "1.0.0"
description = "Personal Japanese AI conversation partner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "openai>=1.60.0",
  "faster-whisper>=1.1.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pykakasi>=2.2.0",
  "py7zr>=0.22.0",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12; platform_system=='Windows'",
  "nvidia-cudnn-cu12; platform_system=='Windows'",
]
desktop = [
  "pywebview>=5.0",
  "pynput>=1.7.0",
  "sounddevice>=0.4.0",
]
desktop-build = [
  "pyinstaller>=6.0",
]

[project.scripts]
kaiwa = "kaiwa.app:main"
kaiwa-desktop = "kaiwa.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kaiwa.desktop" = ["assets/*.png", "assets/*.ico", "assets/*.ogg"]
