[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaiwa"
version = "0.1.0"
description = "Personal Japanese AI conversation partner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "openai>=1.60.0",
  "faster-whisper>=1.1.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pykakasi>=2.2.0",
  "nvidia-cublas-cu12; platform_system=='Windows'",
  "nvidia-cudnn-cu12; platform_system=='Windows'",
]

[project.optional-dependencies]
desktop = [
  "pystray>=0.19.5",
  "Pillow>=10.0.0",
  "pywebview>=5.0",
]

[project.scripts]
kaiwa = "kaiwa.app:main"
kaiwa-desktop = "kaiwa.desktop.tray:main"

[tool.setuptools.packages.find]
where = ["src"]
